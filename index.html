<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form Exercise - Student Registration</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <p>Fill out this form to register for the course</p>
    <hr>
    
    <!-- Form starts here -->
    <form action="#" method="POST">
        
        <!-- Text Input -->
        <h3>Personal Information</h3>
        
        <label for="firstname">First Name: *</label>
        <input type="text" id="firstname" name="firstname" placeholder="Enter your first name" required>
        <br><br>
        
        <label for="lastname">Last Name: *</label>
        <input type="text" id="lastname" name="lastname" placeholder="Enter your last name" required>
        <br><br>
        
        <!-- Email Input -->
        <label for="email">Email Address: *</label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required>
        <br><br>
        
        <!-- Password Input -->
        <label for="password">Password: *</label>
        <input type="password" id="password" name="password" placeholder="Enter password" minlength="6" required>
        <br><br>
        
        <!-- Telephone Input -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="123-456-7890">
        <br><br>
        
        <!-- Date Input -->
        <label for="birthdate">Date of Birth: *</label>
        <input type="date" id="birthdate" name="birthdate" required>
        <br><br>
        
        <!-- Number Input -->
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="16" max="100" placeholder="18">
        <br><br>
        
        <hr>
        
        <!-- Radio Buttons -->
        <h3>Additional Information</h3>
        
        <p>Gender: *</p>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <br>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>
        
        <!-- Select Dropdown -->
        <label for="course">Select Course: *</label>
        <select id="course" name="course" required>
            <option value="">-- Choose a course --</option>
            <option value="web-dev">Web Development</option>
            <option value="data-science">Data Science</option>
            <option value="mobile-dev">Mobile Development</option>
            <option value="ui-ux">UI/UX Design</option>
            <option value="cyber-security">Cyber Security</option>
            <option value="programming">Programming Fundamentals</option>
        </select>
        <br><br>
        
        <!-- Checkboxes -->
        <p>Programming Languages You Know:</p>
        <input type="checkbox" id="html" name="languages" value="html">
        <label for="html">HTML</label>
        <br>
        <input type="checkbox" id="css" name="languages" value="css">
        <label for="css">CSS</label>
        <br>
        <input type="checkbox" id="javascript" name="languages" value="javascript">
        <label for="javascript">JavaScript</label>
        <br>
        <input type="checkbox" id="python" name="languages" value="python">
        <label for="python">Python</label>
        <br>
        <input type="checkbox" id="java" name="languages" value="java">
        <label for="java">Java</label>
        <br><br>
        
        <!-- Range Input -->
        <label for="experience">Experience Level (0-10 years):</label>
        <input type="range" id="experience" name="experience" min="0" max="10" value="0">
        <br><br>
        
        <!-- URL Input -->
        <label for="portfolio">Portfolio Website:</label>
        <input type="url" id="portfolio" name="portfolio" placeholder="https://yourwebsite.com">
        <br><br>
        
        <!-- Color Input -->
        <label for="color">Favorite Color:</label>
        <input type="color" id="color" name="color" value="#0000ff">
        <br><br>
        
        <!-- Textarea -->
        <label for="comments">Why do you want to join this course?</label>
        <br>
        <textarea id="comments" name="comments" rows="5" cols="50" placeholder="Tell us about your motivation..."></textarea>
        <br><br>
        
        <hr>
        
        <!-- File Upload -->
        <label for="resume">Upload Your Resume (PDF):</label>
        <input type="file" id="resume" name="resume" accept=".pdf">
        <br><br>
        
        <!-- Checkbox for Terms -->
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the terms and conditions *</label>
        <br><br>
        
        <!-- Submit Button -->
        <button type="submit">Submit Registration</button>
        
        <!-- Reset Button -->
        <button type="reset">Clear Form</button>
        
    </form>
    
    <hr>
    <p><small>* Required fields</small></p>
    
</body>
</html>
